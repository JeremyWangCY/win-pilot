<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Win-Pilot">
  <title>Win-Pilot</title>
  <!--
    DeepSeek design language, taken from the harness's own design tokens rather
    than guessed: its brand-primary alias resolves to neutral-bluish-1000, i.e.
    a near black, while the blue ramp is reserved for accents such as progress
    and links. So the mark is monochrome ink on a paper square.

      ink    neutral-bluish-1000   #0f1115
      paper  neutral-bluish-00     #ffffff
      accent deepseek-450          #5686fe   (the pointer only)

    The paper square supplies the contrast, so the icon reads on both light and
    dark surfaces without a second dark-mode variant. Corner radius 58/512 is
    about 11.3%, matching the harness app icon's proportion.
  -->
  <rect width="512" height="512" rx="58" fill="#FFFFFF"/>

  <g fill="none" stroke="#0F1115" stroke-width="24" stroke-linejoin="round">
    <!-- Window frame -->
    <rect x="98" y="114" width="316" height="284" rx="34"/>
    <!-- Rule under the title bar -->
    <path d="M122 176 H390" stroke-linecap="round"/>
  </g>

  <!-- Title bar dot -->
  <circle cx="368" cy="145" r="15" fill="#0F1115"/>

  <!-- Pointer: the single blue accent, as in the harness accent usage. -->
  <path d="M200 216 L200 349 L244 306 L273 366 L315 348 L286 289 L343 289 Z" fill="#5686FE"/>
</svg>
