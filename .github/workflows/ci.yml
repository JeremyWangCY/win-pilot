name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build native components
        run: |
          npm run build:wgc
          npm run build:desktop

      - name: Test isolated desktop boundaries
        run: |
          npm run test:desktop
          dotnet run --project native/task-desktop-tests/task-desktop-tests.csproj -c Release
          dotnet run --project native/task-desktop-ui-tests/task-desktop-ui-tests.csproj -c Release -- artifacts/floating-window/layout

      - name: Test
        run: npm test
